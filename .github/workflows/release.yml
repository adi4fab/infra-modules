name: release

on:
  push:
    branches: [main]

# Tag-only release, and the tag points at the ACTUAL commit on main.
#
# We do NOT let commitizen create the tag. `cz bump` makes its own commit
# (it writes CHANGELOG.md) and tags THAT — producing a tag whose tree differs
# from main and which `git describe` cannot see. Instead we ask commitizen only
# for the next version number, then tag GITHUB_SHA ourselves.
#
# Nothing is ever pushed to main, so no ruleset bypass is needed.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # commitizen needs full history and all tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pipx install commitizen

      - name: next version, if any
        id: next
        run: |
          # --yes is REQUIRED: without it cz prompts (e.g. when no tags exist yet)
          # and dies with EOFError in CI.
          #
          # Exit 21 (NoneIncrementExit) means "no releasable commits" — expected.
          # ANY OTHER non-zero is a real failure and must fail the job. Treating
          # every error as "nothing to release" makes a broken step look like a
          # no-op, which is how a release silently stops happening.
          set +e
          VERSION=$(cz bump --get-next --yes 2>/tmp/cz.err)
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release=true"     >> "$GITHUB_OUTPUT"
            echo "next version: v$VERSION"
          elif [ "$RC" -eq 21 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last tag."
          else
            echo "cz bump failed with exit $RC:"
            cat /tmp/cz.err
            exit "$RC"
          fi

      - name: release notes
        if: steps.next.outputs.release == 'true'
        run: |
          cz changelog --unreleased-version "v${{ steps.next.outputs.version }}" \
            --dry-run --incremental > body.md || echo "No changelog entries." > body.md
          cat body.md

      - name: tag the commit that is on main
        if: steps.next.outputs.release == 'true'
        run: |
          V="v${{ steps.next.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" "$GITHUB_SHA" -m "$V"
          git push origin "refs/tags/$V"      # tags only. main is never touched.

      - uses: softprops/action-gh-release@v2
        if: steps.next.outputs.release == 'true'
        with:
          tag_name: v${{ steps.next.outputs.version }}
          body_path: body.md
